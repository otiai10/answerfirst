<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer First</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a65;
    --accent: #1f4e79;
    --accent-text: #ffffff;
    --border: #e2e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --card: #20201d;
      --text: #ecebe6;
      --muted: #9a998f;
      --accent: #7fb0e0;
      --accent-text: #10161c;
      --border: #34332e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 720px; }
  h1 {
      font-size: 4rem;
      font-weight: bolder;
      letter-spacing: .08em;
      margin: 0 0 4px;
      text-align: center;
  }
  .lead { color: var(--muted); font-size: .9rem; margin: 0 0 32px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 28px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .question { font-size: 1.5rem; line-height: 1.6; font-weight: 600; margin: 0; }
  .placeholder { color: var(--muted); font-weight: 400; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
<main>
  <h1>ANSWER FIRST</h1>
  <section class="card">
    <p class="question" id="question"><span class="placeholder"></span></p>
  </section>

  <button id="next">次の質問</button>

</main>

<script>
let QUESTIONS = [];

const qEl = document.getElementById("question");
let deck = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function next() {
  if (QUESTIONS.length === 0) return;
  if (deck.length === 0) deck = shuffle(QUESTIONS);
  const q = deck.pop();
  qEl.textContent = q;
}

fetch("questions.json")
  .then((res) => res.json())
  .then((data) => { QUESTIONS = data; })
  .catch(() => {
    qEl.textContent = "questions.json を読み込めませんでした。ローカルで開く場合は HTTP サーバー経由で開いてください。";
  });

document.getElementById("next").addEventListener("click", next);
document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
});
</script>
</body>
</html>
