<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer First</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a65;
    --accent: #1f4e79;
    --accent-text: #ffffff;
    --border: #e2e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --card: #20201d;
      --text: #ecebe6;
      --muted: #9a998f;
      --accent: #7fb0e0;
      --accent-text: #10161c;
      --border: #34332e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 720px; }
  h1 {
      font-size: 4rem;
      font-weight: bolder;
      letter-spacing: .08em;
      margin: 0 0 4px;
      text-align: center;
  }
  .lead { color: var(--muted); font-size: .9rem; margin: 0 0 32px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 28px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .question { font-size: 1.5rem; line-height: 1.6; font-weight: 600; margin: 0; }
  .placeholder { color: var(--muted); font-weight: 400; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .levels {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 24px 0 8px;
  }
  .levels button {
    width: auto;
    margin: 0;
    padding: 8px 18px;
    font-size: .9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
  }
  .levels button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .levels button:disabled { opacity: .4; cursor: default; }
  .level-desc {
    color: var(--muted);
    font-size: .85rem;
    text-align: center;
    min-height: 1.4em;
    margin: 0 0 24px;
  }
  .hint {
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    color: var(--muted);
    font-size: .95rem;
  }
  .hint b { color: var(--text); font-weight: 600; }
  .hint[hidden] { display: none; }
  .icon-button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 10px;
    margin: 0;
    background: transparent;
    color: var(--muted);
  }
  .icon-button:hover { background: var(--border); color: var(--text); }
  .icon-button svg { width: 24px; height: 24px; }
  .settings-open { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); }
  .settings-panel {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(320px, 100vw);
    max-width: none;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    margin: 0;
    padding: 24px;
    border: 0;
    border-right: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 220ms ease, display 220ms allow-discrete,
      overlay 220ms allow-discrete;
  }
  .settings-panel[open] { transform: translateX(0); }
  .settings-panel::backdrop { background: rgb(0 0 0 / .3); }
  @starting-style {
    .settings-panel[open] { transform: translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .settings-panel { transition: none; }
  }
  body:has(.settings-panel[open]) { overflow: hidden; }
  .settings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .settings-header h2 { font-size: 1.2rem; margin: 0; }
  .hint-toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; cursor: pointer; }
  .hint-toggle input {
    appearance: none;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
    margin: 0;
    border: 1px solid var(--muted);
    border-radius: 999px;
    background: var(--border);
    cursor: pointer;
  }
  .hint-toggle input::before {
    content: "";
    display: block;
    width: 18px;
    height: 18px;
    margin: 3px;
    border-radius: 50%;
    background: var(--muted);
  }
  .hint-toggle input:checked { background: var(--accent); border-color: var(--accent); }
  .hint-toggle input:checked::before { transform: translateX(18px); background: var(--accent-text); }
  .countdown-setting { display: grid; gap: 12px; margin-bottom: 28px; }
  .answer-time { height: 6px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: var(--border); }
  .answer-time-bar { width: 100%; height: 100%; background: var(--accent); }
  select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  .countdown-slot { height: 148px; display: grid; place-items: center; margin-top: 24px; }
  .countdown { --sweep: 0deg; width: 128px; height: 128px; position: relative; display: grid; place-items: center; border: 1px solid var(--muted); border-radius: 50%; color: var(--text); background: conic-gradient(from 0deg, var(--border) 0deg var(--sweep), transparent var(--sweep) 360deg); }
  .countdown[hidden] { display: none; }
  .countdown::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--border); border-radius: 50%; }
  .countdown::after { content: ""; position: absolute; inset: -8px; background: linear-gradient(var(--border), var(--border)) center / 1px 100% no-repeat, linear-gradient(var(--border), var(--border)) center / 100% 1px no-repeat; }
  .countdown span { font: 600 64px/1 ui-monospace, monospace; z-index: 1; }
  .countdown-hand { position: absolute; inset: 0; transform: rotate(var(--sweep)); }
  .countdown-hand::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 50%; background: var(--muted); }
</style>
</head>
<body>
<button class="icon-button settings-open" id="settings-open" aria-label="設定"
  aria-haspopup="dialog" aria-controls="settings-panel" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
    <path d="M18.929,9.130 L19.336,10.441 L21.877,10.436 L21.877,13.564 L19.336,13.559 L18.929,14.870 L18.290,16.085 L20.090,17.878 L17.878,20.090 L16.085,18.290 L14.870,18.929 L13.559,19.336 L13.564,21.877 L10.436,21.877 L10.441,19.336 L9.130,18.929 L7.915,18.290 L6.122,20.090 L3.910,17.878 L5.710,16.085 L5.071,14.870 L4.664,13.559 L2.123,13.564 L2.123,10.436 L4.664,10.441 L5.071,9.130 L5.710,7.915 L3.910,6.122 L6.122,3.910 L7.915,5.710 L9.130,5.071 L10.441,4.664 L10.436,2.123 L13.564,2.123 L13.559,4.664 L14.870,5.071 L16.085,5.710 L17.878,3.910 L20.090,6.122 L18.290,7.915 Z" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3.2"/>
  </svg>
</button>
<dialog class="settings-panel" id="settings-panel" aria-labelledby="settings-title">
  <div class="settings-header">
    <h2 id="settings-title">設定</h2>
    <button class="icon-button" id="settings-close" aria-label="設定を閉じる" autofocus>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </button>
  </div>
  <label class="hint-toggle">ヒントあり<input type="checkbox" id="hint-toggle" role="switch"></label>
  <label class="countdown-setting">回答前カウントダウン
    <select id="countdown-setting">
      <option value="0">使わない</option>
      <option value="3">3秒</option>
      <option value="5" selected>5秒</option>
      <option value="10">10秒</option>
    </select>
  </label>
  <label class="countdown-setting">回答制限時間
    <select id="answer-time-setting">
      <option value="0">なし</option>
      <option value="10">10秒</option>
      <option value="20">20秒</option>
      <option value="30">30秒</option>
    </select>
  </label>
</dialog>
<main>
  <h1>ANSWER FIRST</h1>
  <nav class="levels" id="levels"></nav>
  <p class="level-desc" id="level-desc"></p>
  <section class="card">
    <p class="question" id="question"><span class="placeholder"></span></p>
    <p class="hint" id="hint" hidden></p>
  </section>
  <div class="answer-time" id="answer-time" aria-hidden="true" hidden>
    <div class="answer-time-bar" id="answer-time-bar"></div>
  </div>

  <button id="next">次の質問</button>
  <div class="countdown-slot">
    <div class="countdown" id="countdown" hidden>
      <div class="countdown-hand" aria-hidden="true"></div>
      <span id="countdown-number"></span>
    </div>
  </div>

</main>

<script>
const settingsPanel = document.getElementById("settings-panel");
const settingsOpen = document.getElementById("settings-open");
settingsOpen.addEventListener("click", () => {
  settingsPanel.showModal();
  settingsOpen.setAttribute("aria-expanded", "true");
});
document.getElementById("settings-close").addEventListener("click", () => settingsPanel.close());
settingsPanel.addEventListener("click", (e) => {
  const rect = settingsPanel.getBoundingClientRect();
  if (e.target === settingsPanel &&
      (e.clientX < rect.left || e.clientX > rect.right ||
       e.clientY < rect.top || e.clientY > rect.bottom)) settingsPanel.close();
});
settingsPanel.addEventListener("close", () => {
  settingsOpen.setAttribute("aria-expanded", "false");
  settingsOpen.focus();
});
settingsPanel.addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const controls = settingsPanel.querySelectorAll("button, input, select");
  const first = controls[0];
  const last = controls[controls.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

let LEVELS = {};
let QUESTIONS = [];
let TECHNIQUES = [];

const qEl = document.getElementById("question");
const levelsEl = document.getElementById("levels");
const descEl = document.getElementById("level-desc");
const hintEl = document.getElementById("hint");
const hintToggle = document.getElementById("hint-toggle");
let deck = [];
const countdownSetting = document.getElementById("countdown-setting");
const countdownEl = document.getElementById("countdown");
const countdownNumber = document.getElementById("countdown-number");
let countdownTimer = null;
const answerTimeSetting = document.getElementById("answer-time-setting");
const answerTimeEl = document.getElementById("answer-time");
const answerTimeBar = document.getElementById("answer-time-bar");
let answerAnimation = null;

function resetAnswerTime() {
  if (answerAnimation) answerAnimation.cancel();
  answerAnimation = null;
  answerTimeEl.hidden = answerTimeSetting.value === "0";
}

function startAnswerTime() {
  resetAnswerTime();
  const seconds = Number(answerTimeSetting.value);
  if (!seconds) return;
  answerAnimation = answerTimeBar.animate(
    [{ width: "100%" }, { width: "0%" }],
    { duration: seconds * 1000, easing: "linear", fill: "forwards" }
  );
}

try {
  const saved = localStorage.getItem("answer_time_seconds");
  if (["0", "10", "20", "30"].includes(saved)) answerTimeSetting.value = saved;
} catch (e) {}
resetAnswerTime();
answerTimeSetting.addEventListener("change", () => {
  stopCountdown();
  resetAnswerTime();
  try { localStorage.setItem("answer_time_seconds", answerTimeSetting.value); } catch (e) {}
});

function stopCountdown() {
  cancelAnimationFrame(countdownTimer);
  countdownTimer = null;
  countdownEl.hidden = true;
}

function startCountdown() {
  stopCountdown();
  const seconds = Number(countdownSetting.value);
  if (!seconds) {
    startAnswerTime();
    return;
  }
  const startedAt = performance.now();
  countdownNumber.textContent = seconds;
  countdownEl.style.setProperty("--sweep", "0deg");
  countdownEl.hidden = false;
  function tick(now) {
    const elapsed = (now - startedAt) / 1000;
    if (elapsed >= seconds) {
      stopCountdown();
      startAnswerTime();
      return;
    }
    countdownNumber.textContent = seconds - Math.floor(elapsed);
    countdownEl.style.setProperty("--sweep", `${(elapsed % 1) * 360}deg`);
    countdownTimer = requestAnimationFrame(tick);
  }
  countdownTimer = requestAnimationFrame(tick);
}

try {
  const saved = localStorage.getItem("countdown_seconds");
  if (["0", "3", "5", "10"].includes(saved)) countdownSetting.value = saved;
} catch (e) {}
countdownSetting.addEventListener("change", () => {
  stopCountdown();
  resetAnswerTime();
  try { localStorage.setItem("countdown_seconds", countdownSetting.value); } catch (e) {}
});

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function next() {
  if (QUESTIONS.length === 0) return;
  if (deck.length === 0) deck = shuffle(QUESTIONS);
  const q = deck.pop();
  qEl.textContent = q;
  showHint();
  resetAnswerTime();
  startCountdown();
}

function showHint() {
  if (!hintToggle.checked || !qEl.textContent || TECHNIQUES.length === 0) {
    hintEl.hidden = true;
    return;
  }
  const t = TECHNIQUES[Math.floor(Math.random() * TECHNIQUES.length)];
  hintEl.innerHTML = "";
  const phrase = document.createElement("b");
  phrase.textContent = t.phrase;
  hintEl.append("ヒント：", phrase, `（${t.role}）`);
  hintEl.hidden = false;
}

try { hintToggle.checked = localStorage.getItem("hint") === "on"; } catch (e) {}
hintToggle.addEventListener("change", () => {
  try { localStorage.setItem("hint", hintToggle.checked ? "on" : "off"); } catch (e) {}
  showHint();
});

function selectLevel(key) {
  stopCountdown();
  resetAnswerTime();
  const level = LEVELS[key];
  QUESTIONS = level.questions;
  deck = [];
  qEl.textContent = "";
  hintEl.hidden = true;
  descEl.textContent = level.description || "";
  for (const btn of levelsEl.children) {
    btn.setAttribute("aria-pressed", String(btn.dataset.key === key));
  }
  try { localStorage.setItem("level", key); } catch (e) {}
}

function renderLevels() {
  for (const [key, level] of Object.entries(LEVELS)) {
    const btn = document.createElement("button");
    btn.dataset.key = key;
    btn.textContent = level.label || key;
    btn.disabled = level.questions.length === 0;
    btn.addEventListener("click", () => selectLevel(key));
    levelsEl.appendChild(btn);
  }
  let saved = null;
  try { saved = localStorage.getItem("level"); } catch (e) {}
  const available = Object.keys(LEVELS).filter((k) => LEVELS[k].questions.length > 0);
  selectLevel(available.includes(saved) ? saved : available[0]);
}

fetch("questions.json")
  .then((res) => res.json())
  .then((data) => {
    LEVELS = data.levels;
    TECHNIQUES = Object.values(data.technique || {}).flat();
    renderLevels();
  })
  .catch(() => {
    qEl.textContent = "questions.json を読み込めませんでした。ローカルで開く場合は HTTP サーバー経由で開いてください。";
  });

document.getElementById("next").addEventListener("click", next);
document.addEventListener("keydown", (e) => {
  if (settingsPanel.open || e.target.closest(".levels, .settings-open")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
});
</script>
</body>
</html>
