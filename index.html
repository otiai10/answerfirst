<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer First</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a65;
    --accent: #1f4e79;
    --accent-text: #ffffff;
    --border: #e2e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --card: #20201d;
      --text: #ecebe6;
      --muted: #9a998f;
      --accent: #7fb0e0;
      --accent-text: #10161c;
      --border: #34332e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 720px; }
  h1 {
      font-size: 4rem;
      font-weight: bolder;
      letter-spacing: .08em;
      margin: 0 0 4px;
      text-align: center;
  }
  .lead { color: var(--muted); font-size: .9rem; margin: 0 0 32px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 28px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .question { font-size: 1.5rem; line-height: 1.6; font-weight: 600; margin: 0; }
  .placeholder { color: var(--muted); font-weight: 400; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .levels {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 24px 0 8px;
  }
  .levels button {
    width: auto;
    margin: 0;
    padding: 8px 18px;
    font-size: .9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
  }
  .levels button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .levels button:disabled { opacity: .4; cursor: default; }
  .level-desc {
    color: var(--muted);
    font-size: .85rem;
    text-align: center;
    min-height: 1.4em;
    margin: 0 0 24px;
  }
  .hint-toggle {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    margin: 0 0 8px;
    color: var(--muted);
    font-size: .85rem;
    cursor: pointer;
  }
  .hint-toggle input { accent-color: var(--accent); margin: 0; }
  .hint {
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    color: var(--muted);
    font-size: .95rem;
  }
  .hint b { color: var(--text); font-weight: 600; }
  .hint[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>ANSWER FIRST</h1>
  <nav class="levels" id="levels"></nav>
  <p class="level-desc" id="level-desc"></p>
  <label class="hint-toggle"><input type="checkbox" id="hint-toggle"> ヒント</label>
  <section class="card">
    <p class="question" id="question"><span class="placeholder"></span></p>
    <p class="hint" id="hint" hidden></p>
  </section>

  <button id="next">次の質問</button>

</main>

<script>
let LEVELS = {};
let QUESTIONS = [];
let TECHNIQUES = [];

const qEl = document.getElementById("question");
const levelsEl = document.getElementById("levels");
const descEl = document.getElementById("level-desc");
const hintEl = document.getElementById("hint");
const hintToggle = document.getElementById("hint-toggle");
let deck = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function next() {
  if (QUESTIONS.length === 0) return;
  if (deck.length === 0) deck = shuffle(QUESTIONS);
  const q = deck.pop();
  qEl.textContent = q;
  showHint();
}

function showHint() {
  if (!hintToggle.checked || !qEl.textContent || TECHNIQUES.length === 0) {
    hintEl.hidden = true;
    return;
  }
  const t = TECHNIQUES[Math.floor(Math.random() * TECHNIQUES.length)];
  hintEl.innerHTML = "";
  const phrase = document.createElement("b");
  phrase.textContent = t.phrase;
  hintEl.append("ヒント：", phrase, `（${t.role}）`);
  hintEl.hidden = false;
}

try { hintToggle.checked = localStorage.getItem("hint") === "on"; } catch (e) {}
hintToggle.addEventListener("change", () => {
  try { localStorage.setItem("hint", hintToggle.checked ? "on" : "off"); } catch (e) {}
  showHint();
});

function selectLevel(key) {
  const level = LEVELS[key];
  QUESTIONS = level.questions;
  deck = [];
  qEl.textContent = "";
  hintEl.hidden = true;
  descEl.textContent = level.description || "";
  for (const btn of levelsEl.children) {
    btn.setAttribute("aria-pressed", String(btn.dataset.key === key));
  }
  try { localStorage.setItem("level", key); } catch (e) {}
}

function renderLevels() {
  for (const [key, level] of Object.entries(LEVELS)) {
    const btn = document.createElement("button");
    btn.dataset.key = key;
    btn.textContent = level.label || key;
    btn.disabled = level.questions.length === 0;
    btn.addEventListener("click", () => selectLevel(key));
    levelsEl.appendChild(btn);
  }
  let saved = null;
  try { saved = localStorage.getItem("level"); } catch (e) {}
  const available = Object.keys(LEVELS).filter((k) => LEVELS[k].questions.length > 0);
  selectLevel(available.includes(saved) ? saved : available[0]);
}

fetch("questions.json")
  .then((res) => res.json())
  .then((data) => {
    LEVELS = data.levels;
    TECHNIQUES = Object.values(data.technique || {}).flat();
    renderLevels();
  })
  .catch(() => {
    qEl.textContent = "questions.json を読み込めませんでした。ローカルで開く場合は HTTP サーバー経由で開いてください。";
  });

document.getElementById("next").addEventListener("click", next);
document.addEventListener("keydown", (e) => {
  if (e.target.closest(".levels, .hint-toggle")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
});
</script>
</body>
</html>
